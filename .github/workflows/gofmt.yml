name: gofmt

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - ".github/workflows/gofmt.yml"
  workflow_dispatch:

permissions:
  contents: write

# Uma execução por vez: senão, submits seguidos da extensão disputariam a branch.
concurrency:
  group: gofmt
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Format Go files
        run: |
          # Um arquivo com erro de sintaxe faz o gofmt sair com 2; avisa e formata o resto.
          if ! gofmt -w .; then
            echo "::warning::o gofmt não conseguiu ler alguns arquivos; eles ficaram como estavam"
          fi

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Tudo já está formatado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: gofmt"
          # A extensão pode ter feito um commit enquanto este job rodava.
          git pull --rebase origin main
          git push origin HEAD:main
